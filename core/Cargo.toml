[package]
name = "andamp-core"
description = "The player behind Andamp for macOS: the walkit skin engine, its host, a software renderer and the audio engine, behind a C interface"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
rust-version = "1.85"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
walkit = { version = "0.10.4", features = ["truetype"] }
image = { version = "0.25.10", default-features = false, features = ["png", "bmp", "gif", "jpeg"] }
zip = { version = "2.6.1", default-features = false, features = ["deflate"] }
# the audio: decoding, the output unit, the ring between them, and the visualizer's spectrum
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "aac", "isomp4", "alac", "flac", "ogg", "vorbis", "wav", "pcm", "aiff"] }
coreaudio-rs = { version = "0.14.2", default-features = false, features = ["audio_unit", "core_audio"] }
rtrb = "0.4.1"
rustfft = "6.4.1"
# internet radio: the stream over HTTP
ureq = "3"
# effect plug-ins are Lua files: the interpreter, built from its own sources
mlua = { version = "0.10", features = ["lua54", "vendored"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# a panic in the engine unwinds to the C boundary, where the app reports it as the skin's failure
panic = "unwind"
debug = "line-tables-only"
