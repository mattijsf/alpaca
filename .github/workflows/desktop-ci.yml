# The gate on a Mac, the core's tests on Windows and Linux, and the Mac's app.
name: Desktop CI

# Manual-only to keep Actions minutes near zero: the lefthook pre-push gate runs the same
# checks locally on every push. Start it from the Actions tab ("Run workflow") or with:
# gh workflow run ci.yml
on:
  workflow_dispatch:

jobs:
  gate:
    name: the gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - run: tools/gate.sh

  core:
    name: core on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # cpal talks to ALSA on Linux
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # no test opens the audio device or a window, so the same tests run everywhere
      - run: cargo test --release
        working-directory: core

  app:
    name: the Mac's app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: apps/mac
      - run: >
          xcodebuild -project apps/mac/Alpaca.xcodeproj -scheme Alpaca -configuration Release
          -derivedDataPath build build
