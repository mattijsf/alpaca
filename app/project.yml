# The Xcode project, Andamp.xcodeproj, is made from this file with XcodeGen
# (`xcodegen generate` in this folder). The project itself is not committed.
name: Andamp
options:
  bundleIdPrefix: nl.mattix.andamp
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Andamp:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: ../core/include/andamp_core.h
        buildPhase: none
      - path: Resources/skins
        type: folder
        buildPhase: resources
      - path: Resources/fonts
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Andamp
        PRODUCT_BUNDLE_IDENTIFIER: nl.mattix.andamp.mac
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Andamp
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_NSHumanReadableCopyright: GPL-3.0-or-later
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        SWIFT_OBJC_BRIDGING_HEADER: ../core/include/andamp_core.h
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/../core/target/macos
        # the Rust library and the system frameworks its audio output calls
        OTHER_LDFLAGS: -landamp_core -framework AudioToolbox -framework AudioUnit -framework CoreAudio
        ONLY_ACTIVE_ARCH: YES
    preBuildScripts:
      - name: Build the andamp-core library
        script: exec "$PROJECT_DIR/../core/build.sh"
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(PROJECT_DIR)/../core/target/macos/libandamp_core.a
