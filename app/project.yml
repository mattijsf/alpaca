# The Xcode project, Andamp.xcodeproj, is made from this file with XcodeGen
# (`xcodegen generate` in this folder). The project itself is not committed.
name: Andamp
options:
  bundleIdPrefix: nl.mattix.andamp
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Andamp:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: ../core/include/andamp_core.h
        buildPhase: none
      - path: Resources/skins
        type: folder
        buildPhase: resources
      - path: Resources/fonts
        type: folder
        buildPhase: resources
      - path: Resources/wasabi
        type: folder
        buildPhase: resources
      - path: Resources/plugins
        type: folder
        buildPhase: resources
    info:
      # written by XcodeGen, not committed
      path: Info.plist
      properties:
        CFBundleDisplayName: Andamp
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.music
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: GPL-3.0-or-later
        NSPrincipalClass: NSApplication
        # Finder offers the app for songs, and for skins by their file name's ending
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio]
          - CFBundleTypeName: Winamp skin
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes: [nl.mattix.andamp.skin.classic, nl.mattix.andamp.skin.modern]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: nl.mattix.andamp.skin.classic
            UTTypeDescription: Classic Winamp skin
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [wsz]
          - UTTypeIdentifier: nl.mattix.andamp.skin.modern
            UTTypeDescription: Modern Winamp skin
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [wal]
    settings:
      base:
        PRODUCT_NAME: Andamp
        PRODUCT_BUNDLE_IDENTIFIER: nl.mattix.andamp.mac
        SWIFT_OBJC_BRIDGING_HEADER: ../core/include/andamp_core.h
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/../core/target/macos
        # the Rust library and the system frameworks its audio output calls
        OTHER_LDFLAGS: -landamp_core -framework AudioToolbox -framework AudioUnit -framework CoreAudio
        # the Visualizer window draws with OpenGL, which Apple has deprecated and still ships
        GCC_PREPROCESSOR_DEFINITIONS: GL_SILENCE_DEPRECATION=1
        ONLY_ACTIVE_ARCH: YES
    postBuildScripts:
      # the Milkdrop engine, when vis/build-projectm.sh built it: a library of its own in the
      # app's Frameworks folder, which the app loads when the Visualizer window opens
      - name: Copy the Milkdrop engine
        script: |
          lib="$PROJECT_DIR/../vis/lib/libprojectM-4.dylib"
          if [ -f "$lib" ]; then
            mkdir -p "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH"
            cp -f "$lib" "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/"
            codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/libprojectM-4.dylib"
          fi
        basedOnDependencyAnalysis: false
    preBuildScripts:
      - name: Build the andamp-core library
        script: exec "$PROJECT_DIR/../core/build.sh"
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(PROJECT_DIR)/../core/target/macos/libandamp_core.a
